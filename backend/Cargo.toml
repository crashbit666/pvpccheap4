[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "backend"
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "cron_runner"
path = "src/bin/cron_runner.rs"

[dependencies]
actix-web = "4.17.0"
actix-cors = "0.7.2"
async-trait = "0.1.92"
diesel = { version = "2.3.14", features = [
    "postgres",
    "chrono",
    "r2d2",
    "serde_json",
] }
diesel_migrations = "2.3.2" # Auto-run migrations
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
tokio = { version = "1.54.0", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
# Auth & Crypto
argon2 = "0.6.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
hex = "0.4.3"
md5 = "0.8.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
log = "0.4.34"
env_logger = "0.11.11"
# MQTT for smart home device control (websocket for Meross which uses MQTT over WSS on port 443)
rumqttc = { version = "0.25.1", features = ["use-rustls", "websocket", "url"] }
tokio-rustls = "0.26.6"
rustls-native-certs = "0.8.5"
urlencoding = "2.1.3"
rand = "0.10.3"
tokio-cron-scheduler = "0.15.1"
chrono-tz = "0.10.4"
aes-gcm = "0.11.1"
base64 = "0.23.1"
sha2 = "0.10"

[dev-dependencies]
actix-rt = "2.15.0"
