<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · PVPC Cheap</title>
<style>
  :root { color-scheme: light dark; --fg: #1f2937; --muted: #6b7280; --bg: #ffffff; --accent: #0f766e; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e5e7eb; --muted: #9ca3af; --bg: #111827; --accent: #5eead4; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin-bottom: 0; }
  h2 { font-size: 1.15rem; margin-top: 2rem; }
  a { color: var(--accent); }
  .updated { color: var(--muted); margin-top: 4px; }
  nav { margin-top: 3rem; color: var(--muted); font-size: .9rem; }
  label { display: block; margin-top: 1rem; }
  input { display: block; width: 100%; max-width: 360px; box-sizing: border-box; padding: 10px; margin-top: 4px;
          font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--muted); border-radius: 8px; }
  button { margin-top: 1.5rem; padding: 10px 20px; font: inherit; color: var(--bg); background: var(--accent);
           border: 0; border-radius: 8px; cursor: pointer; }
  .error { color: #dc2626; }
</style>
</head>
<body>
<main>
{{BODY}}
<nav><a href="/privacitat">Privacitat</a> · <a href="/condicions">Condicions</a> · <a href="/esborrar-compte">Esborrar el compte</a></nav>
</main>
</body>
</html>
